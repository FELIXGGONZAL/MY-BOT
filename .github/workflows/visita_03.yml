name: VISITA CADA 10 SEGUNDOS - BOT 03
on:
  schedule:
    - cron: "*/5 17-21 * * 5,6,0"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install chromium
      - run: python mantenimiento.py
