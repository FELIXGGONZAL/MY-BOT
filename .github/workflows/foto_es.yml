name: Bot_Fotografo_Espana

on:
  workflow_dispatch: # Se activa cuando tú quieras

jobs:
  foto_espanola:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Navegador
        run: |
          pip install playwright
          playwright install chromium

      - name: Ejecutar Captura
        run: python bot_foto_es.py

      - name: Guardar la Foto
        uses: actions/upload-artifact@v4
        with:
          name: captura-apartamento-es
          path: captura_espanol.png
