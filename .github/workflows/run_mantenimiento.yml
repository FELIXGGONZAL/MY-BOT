name: VISITA CADA 10 SEGUNDOS

on:
  schedule:
    - cron: "*/5 * * * *"  # Esto lo lanza cada 5 minutos
  workflow_dispatch:      # Esto te permite lanzarlo tú a mano

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas
        run: |
          pip install playwright
          playwright install chromium
      - name: Ejecutar visitas
        run: python mantenimiento.py
