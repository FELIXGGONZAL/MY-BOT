name: FOTO DEL ANUNCIO (ESPAÑOL)

on:
  schedule:
    - cron: "*/5 17-21 * * 0" # Este lo ponemos cada 10 min para no saturar
  workflow_dispatch:        # Para lanzarlo a mano

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install chromium
      - run: python bot_foto.py
      - name: Subir la foto a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: captura-apartamento
          path: captura_final.png
