name: Bot_Booking_Anual

on:
  schedule:
    - cron: '*/5 * * * *'  # Esto significa: ejecutar cada 5 minutos
  workflow_dispatch:       # Esto nos da un botón para probarlo a mano

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests

      - name: Correr el bot
        run: python bot.py
